<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
</head>
<body>
    <form action="">
        <fieldset>
            <legend>Make an account !</legend>
            <table>
                <tr>
                    <td><br></td> 
                </tr>
                <tr>
                    <td><label for="">Name :</label></td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td><br></td> 
                </tr>
                <tr>
                    <td><label for="">Surname :</label></td>
                    <td><input type="text"></td>
                </tr>
                <tr>
                    <td><br></td> 
                </tr>
                <tr>
                    <td><label for="">Age :</label></td>
                    <td><input type="number"></td>
                </tr>
                <tr>
                    <td><br></td> 
                </tr>
                <tr>
                    <td><label for="">Gender :</label></td>
                    <td>
                        <input type="radio" name="rg">Female
                        <input type="radio" name="rg">Male
                    </td>
                </tr>
                <tr>
                    <td><br></td> 
                </tr>
                <tr>
                    <td><label for="">Email :</label></td>
                    <td><input type="email" placeholder="exmpl@example.com"></td>
                </tr>
                <tr>
                    <td><br></td> 
                </tr>
                <tr>
                    <td><label for="">Password :</label></td>
                    <td><input type="password"></td>
                </tr>
                <tr>
                    <td><br></td> 
                </tr>
                <tr>
                    <td><label for="">Confirm your password :</label></td>
                    <td><input type="password"></td>
                </tr>
                <tr>
                    <td><br></td> 
                </tr>
                <tr>
                    <td><label for="">Entertainment :</label></td>
                    <td>
                        <input type="checkbox">I'm into anime 
                        <input type="checkbox">I'm into video-games
                    </td>
                </tr>
                <tr>
                    <td><br></td> 
                </tr>
                <tr>
                    <td><label for="">Region :</label></td>
                    <td><select name="" id="">
                        <option value="">Select your Region</option>
                        <option value="">US</option>
                        <option value="">EU</option>
                        <option value="">MENA</option>
                        <option value="">AFRICA</option>
                    </select></td>
                </tr>
                <tr>
                    <td><br></td> 
                </tr>
                <tr>
                    <td><label for="">if you have a complaint :</label></td>
                    <td><textarea rows="5" cols="30" name="" id="" placeholder="your complaint here..."></textarea></td>
                </tr>
                <tr>
                    <td><br></td> 
                </tr>
                <tr>
                    <td><input type="submit" value="submit"><input type="reset" value="reset"></td>
                </tr>
            </table>
        </fieldset>
    </form>
</body>
</html>
