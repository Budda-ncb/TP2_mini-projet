<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact</title>
</head>
<body>
    <header>
        <h1>Contactez-nous / Inscrivez-vous</h1>
    </header>
    <nav>
        <a href="anime.html">learn about Anime</a>
        <a href="video-game.html">learn about Video-games</a>
    </nav>
    <main>
        <form action="">
            <fieldset>
                <legend>Vos coordonneés</legend>
                <label for="">Nom* </label>
                <input type="text" required autofocus maxlength="50" placeholder="Votre nom"><br>
                <label for="">Prénom* </label>
                <input type="text" required maxlength="50" placeholder="Votre prénom"><br><br>
                <label for="">Date de naissance </label>
                <input type="date">
                <label for="">Adresse email* </label>
                <input type="email" required placeholder="exemple@email.com"><br><br>
                <label for="">Site web </label>
                <input type="url" value="http://www." placeholder="http://monsite.com"><br><br>
                <label for="">Code secret</label>
                <input type="password" minlength="6" maxlength="20"><br><br>
                <label for="">Genre </label>
                <input type="radio" name="r" checked>Homme <input type="radio" name="r">Femme <br><br>
                <label for="">Pays</label>
                <select name="" id="">
                    <option value="">Tunisie</option>
                    <option value="">Algerie</option>
                    <option value="">Maroc</option>
                    <option value="">France</option>
                    <option value="">Autre</option>
                </select><br><br>
                
            </fieldset>
            <fieldset>
                <legend>Information complémentaires</legend>
                <label for="Telephon"></label>
                <input type="tel" pattern="[0-9]{8}" placeholder="12345678"><br><br>
                <label for="">Adresse postale </label>
                <input type="text" placeholder="Votre adresse"><br><br>
                <label for="">Code postale</label>
                <input type="text" value="1000" maxlength="4"><br><br>
                <label for="">Semester </label>
                <select name="" id="">
                    <option value="">S1</option>
                    <option value="">S2</option>
                    <option value="">S3</option>
                    <option value="">S4</option>
                </select><br><br>
                <label for="">Région préférée </label>
                <select name="" id="">
                    <option value="">Tunis</option>
                    <option value="">Sousse</option>
                    <option value="">Sfax</option>
                    <option value="">Djerba</option>
                    <option value="">Tozeur</option>
                </select>
            </fieldset>
            <fieldset>
                <legend>Gouts et centres </legend>
                <label for="">Centres d'intéret</label>
                <input type="checkbox" checked>Culture <input type="checkbox">Gastronomie <input type="checkbox">Plage <input type="checkbox">Désert <input type="checkbox">Histoire <br><br>
                <label for="">Niveau en HTML</label>
                <input type="range" min="0" max="100" step="10"><br><br>
                <label for="">Note de satisfaction</label>
                <input type="number" min="1" max="10" step="1"><br><br>
                <label for="">Message/Commentaire</label>
                <textarea name="" id="" rows="5" cols="40" placeholder="adapté"></textarea>
             </fieldset>
             <fieldset>
                <legend>Photp </legend>
                <label for="">Photo de profil</label>
                <input type="file" accept="image/*"><br><br>
                <input type="submit" value="Envoyer"> <input type="reset" value="Effacer">
             </fieldset>
        </form>
        
        <a href="index.html">return to main page</a>
    </main>
    <footer>
        <a href="about.html">about us</a>
    </footer>
</body>
</html>
